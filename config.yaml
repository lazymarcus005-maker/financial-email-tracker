# Financial Email Tracker Config

# Gmail
GMAIL_QUERY: "{from:KPLUS@kasikornbank.com from:admin@krungsri.com from:scbeasynet@scb.co.th from:LHBYou@lhbank.co.th} newer_than:90d -subject:\"Login Notification\""
GMAIL_CLIENT_ID: "{{ env.GMAIL_CLIENT_ID }}"
GMAIL_CLIENT_SECRET: "{{ env.GMAIL_CLIENT_SECRET }}"

# Database
DATABASE_BACKEND: "aiosqlite"          # "aiosqlite" (local file) | "postgres" (PostgreSQL server)
DATABASE_PATH: "data/finance.db"       # used when DATABASE_BACKEND == "aiosqlite"
DATABASE_URL: "{{ env.DATABASE_URL }}"             # used when DATABASE_BACKEND == "postgres", e.g. postgresql://user:pass@host:5432/db
DATABASE_SSL: "{{ env.DATABASE_SSL }}"

# Scheduler (Cron times in Asia/Bangkok)
SCHEDULE:
  - "05:00"  # Early morning
  - "10:00"  # Mid-morning
  - "14:00"  # Afternoon
  - "22:00"  # Evening (Daily summary)

TIMEZONE: "Asia/Bangkok"
# scheduler backend: "background" (BackgroundScheduler, runs jobs in a thread;
# safe for the standalone `python -m app.ingestion.scheduler` entrypoint) or
# "asyncio" (AsyncIOScheduler, runs jobs on the FastAPI event loop - use this
# when the web app and scheduler share a process to avoid creating a new
# event loop per cron tick via `asyncio.run`).
SCHEDULER_BACKEND: "background"

# LINE
LINE_CHANNEL_ACCESS_TOKEN: "{{ env.LINE_CHANNEL_ACCESS_TOKEN }}"
LINE_USER_ID: "{{ env.LINE_USER_ID }}"

# AI (optional)
AI_ENABLED: false
OLLAMA_BASE_URL: "http://localhost:11434"
OLLAMA_MODEL: "gemma3:1b"  # or gemma3:1b qwen3:1.7b

# Parser
PARSER_VERSION: "1.0"

# Web
WEB_HOST: "0.0.0.0"
WEB_PORT: 8000
PUBLIC_BASE_URL: "{{ env.PUBLIC_BASE_URL }}"
AUTH_SECRET_KEY: "{{ env.AUTH_SECRET_KEY }}"
AUTH_COOKIE_NAME: "fet_session"
AUTH_SESSION_TTL_SECONDS: 604800

# Logging
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"  # or "text"

# MCP (Model Context Protocol) - local stdio server for AI agents, disabled by default
MCP_ENABLED: false
MCP_OWNER_USER_ID: "{{ env.MCP_OWNER_USER_ID }}"
MCP_ALLOW_WRITE: false
MCP_ALLOW_SEND: false
MCP_EXPOSE_RAW_EMAIL: false
MCP_API_TOKEN: "{{ env.MCP_API_TOKEN }}"
