services:
  app:
    build: .
    container_name: financial-email-tracker
    ports:
      - "8000:8000"
    volumes:
      - finance_data:/app/data
      - ./secrets:/app/secrets
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/finance.db}
      - GMAIL_CREDENTIALS_PATH=${GMAIL_CREDENTIALS_PATH:-/app/secrets/credentials.json}
      - GMAIL_TOKEN_PATH=${GMAIL_TOKEN_PATH:-/app/secrets/token.json}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_USER_ID=${LINE_USER_ID:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:1.7b}
      - TIMEZONE=${TIMEZONE:-Asia/Bangkok}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - finance

  # Optional: Ollama for AI-assisted categorization
  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - finance
    restart: unless-stopped
    profiles:
      - ai  # Run with: docker compose --profile ai up

volumes:
  finance_data:
  ollama_data:

networks:
  finance:
    driver: bridge
