services:
  app:
    build: .
    container_name: financial-email-tracker
    ports:
      - "8000:8000"
    volumes:
      - finance_data:/app/data
      - ./secrets:/app/secrets
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/finance.db}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_USER_ID=${LINE_USER_ID:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:1b}
      - TIMEZONE=${TIMEZONE:-Asia/Bangkok}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - finance

  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - finance
    profiles:
      - ai

  ollama-init:
    image: ollama/ollama:latest
    container_name: finance-ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling gemma3:1b..."
        ollama pull gemma3:1b
        echo "Model ready."
    restart: "no"
    networks:
      - finance
    profiles:
      - ai

volumes:
  finance_data:
  ollama_data:

networks:
  finance:
    driver: bridge
