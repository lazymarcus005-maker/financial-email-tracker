<form
    class="inline-flex items-center gap-1"
    hx-patch="/api/transactions/{{ t.id }}"
    hx-target="closest td"
    hx-swap="innerHTML"
    hx-trigger="submit"
    onsubmit="const val = this.querySelector('input[name=category]').value; this.setAttribute('hx-vals', JSON.stringify({category: val}));"
>
    <input
        type="text"
        name="category"
        value="{{ t.category or '' }}"
        class="input h-7 w-28 px-2 py-0 text-xs"
        list="categories-{{ t.id }}"
        autofocus
    >
    <button type="submit" class="btn btn-primary btn-sm !h-7 !px-2">Save</button>
    <button
        type="button"
        class="btn btn-outline btn-sm !h-7 !px-2"
        hx-get="/transactions"
        hx-target="#transactions-table"
        hx-select="#transactions-table"
        hx-swap="outerHTML"
        hx-push-url="true"
    >Cancel</button>
    <datalist id="categories-{{ t.id }}">
        {% for cat in categories %}
        <option value="{{ cat }}">
        {% endfor %}
    </datalist>
</form>
