{% extends "base.html" %}

{% block title %}Users - Financial Email Tracker{% endblock %}

{% block content %}
<div class="flex items-center justify-between gap-4 mb-6">
    <h1 class="text-xl font-semibold text-neutral-900">Users</h1>
    <div id="users-status" class="text-sm text-neutral-500"></div>
</div>

<div class="card mb-6">
    <h2 class="text-sm font-medium text-neutral-900 mb-3">Add User</h2>
    <form class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end" hx-post="/api/users" hx-target="#users-table" hx-swap="outerHTML">
        <div class="md:col-span-1">
            <label for="display_name" class="block text-xs text-neutral-500 mb-1">Name</label>
            <input id="display_name" name="display_name" class="input" required>
        </div>
        <div class="md:col-span-1">
            <label for="email" class="block text-xs text-neutral-500 mb-1">Email</label>
            <input id="email" name="email" type="email" class="input" required>
        </div>
        <div class="md:col-span-1">
            <label for="password" class="block text-xs text-neutral-500 mb-1">Password</label>
            <input id="password" name="password" type="password" minlength="8" class="input" required>
        </div>
        <div class="md:col-span-1">
            <label for="role" class="block text-xs text-neutral-500 mb-1">Role</label>
            <select id="role" name="role" class="input">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="md:col-span-1">
            <input type="hidden" name="is_active" value="true">
            <button type="submit" class="w-full px-4 py-2 rounded-lg bg-neutral-900 text-white text-sm font-medium hover:bg-neutral-700">Add</button>
        </div>
    </form>
</div>

<div class="card">
    {% include "partials/users_table.html" %}
</div>
{% endblock %}
