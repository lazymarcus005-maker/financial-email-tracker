{% if error %}
<p class="text-sm text-destructive">{{ error }}</p>
{% else %}
<dl class="text-xs text-muted-foreground mb-3 space-y-1">
    <div><span class="font-medium">From:</span> {{ email.sender }}</div>
    <div><span class="font-medium">Subject:</span> {{ email.subject }}</div>
    <div><span class="font-medium">Received:</span> {{ email.received_at }}</div>
</dl>
<pre class="text-xs whitespace-pre-wrap break-words bg-muted/50 border border-border rounded-lg p-3 max-h-96 overflow-y-auto font-mono">{{ email.body_text }}</pre>
{% endif %}
