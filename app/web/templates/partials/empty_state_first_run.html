<div class="empty-state">
    <svg xmlns="http://www.w3.org/2000/svg" class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
    </svg>
    <h3 class="text-sm font-medium text-foreground mb-1">{{ title|default('No data yet') }}</h3>
    <p class="text-sm text-muted-foreground mb-4">{{ message|default('Run your first ingestion to get started.') }}</p>
    <a href="/" class="btn btn-primary btn-md">Run Ingestion Now</a>
</div>
