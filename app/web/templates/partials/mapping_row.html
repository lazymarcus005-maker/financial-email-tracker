<tr id="mapping-row-{{ item.id }}" class="border-b border-neutral-100">
    <td class="px-4 py-3">{{ item.counterparty }}</td>
    <td class="px-4 py-3">
        <input type="text" id="category-{{ item.id }}" value="{{ item.category }}" class="input">
    </td>
    <td class="px-4 py-3">{{ item.source or '-' }}</td>
    <td class="px-4 py-3 whitespace-nowrap">{{ item.created_at }}</td>
    <td class="px-4 py-3 whitespace-nowrap">
        <button
            class="px-2 py-1 rounded-md border border-neutral-300 text-xs hover:bg-neutral-100"
            hx-patch="/api/mappings/{{ item.id }}"
            hx-target="#mapping-row-{{ item.id }}"
            hx-swap="outerHTML"
            hx-vals='js:{category: document.getElementById("category-{{ item.id }}").value}'
            hx-disabled-elt="this"
        >Save</button>
        <button
            class="px-2 py-1 rounded-md border border-red-300 text-red-600 text-xs hover:bg-red-50"
            hx-delete="/api/mappings/{{ item.id }}"
            hx-target="#mapping-row-{{ item.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this mapping?"
            hx-disabled-elt="this"
        >Delete</button>
    </td>
</tr>
