<tr id="mapping-row-{{ item.id }}">
    <td>{{ item.counterparty }}</td>
    <td>
        <input type="text" id="category-{{ item.id }}" value="{{ item.category }}" class="input" list="categories">
    </td>
    <td>{{ item.source or '-' }}</td>
    <td class="whitespace-nowrap">{{ item.created_at }}</td>
    <td class="whitespace-nowrap">
        <div class="flex flex-wrap gap-1.5">
        <button
            class="btn btn-outline btn-sm"
            hx-patch="/api/mappings/{{ item.id }}"
            hx-target="#mapping-row-{{ item.id }}"
            hx-swap="outerHTML"
            hx-vals='js:{category: document.getElementById("category-{{ item.id }}").value}'
            hx-disabled-elt="this"
        >Save</button>
        <button
            class="btn btn-destructive-outline btn-sm"
            hx-delete="/api/mappings/{{ item.id }}"
            hx-target="#mapping-row-{{ item.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this mapping?"
            hx-disabled-elt="this"
        >Delete</button>
        </div>
    </td>
</tr>
