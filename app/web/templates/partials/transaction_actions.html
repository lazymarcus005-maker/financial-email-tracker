<div id="transaction-actions" class="card card-body mb-6">
    <h2 class="text-sm font-medium text-foreground mb-3">Actions</h2>
    <div class="flex flex-wrap items-end gap-3">
        <div>
            <label for="category-input" class="label">Category</label>
            <input type="text" id="category-input" value="{{ t.category or '' }}" class="input">
        </div>
        <button
            class="btn btn-primary btn-md"
            hx-patch="/api/transactions/{{ t.id }}"
            hx-target="#transaction-actions"
            hx-swap="outerHTML"
            hx-vals='js:{category: document.getElementById("category-input").value}'
            hx-disabled-elt="this"
        >Save Category</button>

        {% if t.status == 'ignored' %}
        <button
            class="btn btn-outline btn-md"
            hx-patch="/api/transactions/{{ t.id }}"
            hx-target="#transaction-actions"
            hx-swap="outerHTML"
            hx-vals='{"ignore": false}'
            hx-disabled-elt="this"
        >Unignore</button>
        {% else %}
        <button
            class="btn btn-outline btn-md"
            hx-patch="/api/transactions/{{ t.id }}"
            hx-target="#transaction-actions"
            hx-swap="outerHTML"
            hx-vals='{"ignore": true}'
            hx-disabled-elt="this"
        >Ignore</button>
        {% endif %}

        <button
            class="btn btn-outline btn-md"
            hx-post="/api/reparse/{{ t.id }}"
            hx-target="#transaction-actions"
            hx-swap="outerHTML"
            hx-disabled-elt="this"
        >Reparse</button>

        <button
            class="btn btn-destructive-outline btn-md"
            hx-delete="/api/transactions/{{ t.id }}"
            hx-target="body"
            hx-swap="innerHTML"
            hx-confirm="Delete this transaction?"
            hx-disabled-elt="this"
        >Delete</button>
    </div>
</div>
