{% extends "base.html" %}

{% block title %}Setup - Financial Email Tracker{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="card">
        <div class="card-header">
            <h1 class="card-title text-xl">Create Admin User</h1>
            <p class="card-description">Set up the first administrator account.</p>
        </div>
        <form method="post" action="/setup" class="card-content space-y-4">
            {% if error %}
            <div class="alert alert-destructive">{{ error }}</div>
            {% endif %}
            <div>
                <label for="display_name" class="label">Name</label>
                <input id="display_name" name="display_name" type="text" autocomplete="name" class="input" required autofocus>
            </div>
            <div>
                <label for="email" class="label">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" class="input" required>
            </div>
            <div>
                <label for="password" class="label">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" class="input" required>
            </div>
            <button type="submit" class="btn btn-primary btn-md w-full">Create Admin</button>
        </form>
    </div>
</div>
{% endblock %}
