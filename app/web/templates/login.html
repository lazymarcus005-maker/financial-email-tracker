{% extends "base.html" %}

{% block title %}Login - Financial Email Tracker{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="card">
        <div class="card-header">
            <h1 class="card-title text-xl">Login</h1>
            <p class="card-description">Sign in to your account to continue.</p>
        </div>
        <form method="post" action="/login" class="card-content space-y-4">
            {% if error %}
            <div class="alert alert-destructive">{{ error }}</div>
            {% endif %}
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label for="email" class="label">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" class="input" required autofocus>
            </div>
            <div>
                <label for="password" class="label">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" class="input" required>
            </div>
            <button type="submit" class="btn btn-primary btn-md w-full">Login</button>
        </form>
    </div>
</div>
{% endblock %}
