{% extends "base.html" %}

{% block title %}Login - Financial Email Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-xl font-semibold text-neutral-900 mb-6">Login</h1>
    <form method="post" action="/login" class="card space-y-4">
        {% if error %}
        <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{{ error }}</div>
        {% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
            <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" class="input" required autofocus>
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-neutral-700 mb-1">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" class="input" required>
        </div>
        <button type="submit" class="w-full px-4 py-2 rounded-lg bg-neutral-900 text-white text-sm font-medium hover:bg-neutral-700">Login</button>
    </form>
</div>
{% endblock %}
